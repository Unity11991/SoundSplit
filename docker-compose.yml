version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: stemlab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stemlab_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-stemlab_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stemlab_net

  # Redis In-Memory Queue & PubSub
  redis:
    image: redis:7-alpine
    container_name: stemlab_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - stemlab_net

  # FastAPI REST API Backend
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: stemlab_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-stemlab_secret_password}@db:5432/${POSTGRES_DB:-stemlab_db}
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_LOCAL_DIR=/app/storage
      - MAX_UPLOAD_SIZE_MB=100
      - MAX_AUDIO_DURATION_SECONDS=600
      - SECRET_KEY=${SECRET_KEY:-stemlab-production-secret-key-replace-in-env}
    volumes:
      - audio_storage:/app/storage
    networks:
      - stemlab_net
    expose:
      - "8000"

  # Asynchronous AI Audio Inference Worker
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: stemlab_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-stemlab_secret_password}@db:5432/${POSTGRES_DB:-stemlab_db}
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_LOCAL_DIR=/app/storage
      - DEFAULT_MODEL=htdemucs
    volumes:
      - audio_storage:/app/storage
      - model_cache:/home/workeruser/.cache/torch/hub
    networks:
      - stemlab_net
    # Optional GPU support uncomment when NVIDIA Container Toolkit is installed:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: stemlab_web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - stemlab_net
    expose:
      - "3000"

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: stemlab_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - stemlab_net

volumes:
  postgres_data:
  redis_data:
  audio_storage:
  model_cache:

networks:
  stemlab_net:
    driver: bridge
